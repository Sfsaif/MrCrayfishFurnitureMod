name: Build Minecraft 1.7.10 Mod

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    # We use ubuntu-20.04 because newer runners sometimes lack compatibility with very old build tools
    runs-on: ubuntu-20.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 8
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'
        # Caching gradle dependencies speeds up future builds significantly
        cache: 'gradle'

    - name: Grant Execute Permission for Gradlew
      run: chmod +x gradlew

    # ForgeGradle 1.2 requires setting up the workspace before building
    - name: Setup CI Workspace
      run: ./gradlew setupCIWorkspace --no-daemon

    - name: Build Mod
      run: ./gradlew build --no-daemon

    - name: Upload Built Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Minecraft-1.7.10-Mod
        path: build/libs/*.jar
